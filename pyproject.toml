[build-system]
requires = ["hatchling==1.18.0"]
build-backend = "hatchling.build"

[project]
name = "pyterraformer"
version = "0.1.0"
description = "Enjoyable terraform manipulation from python."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Pyterraformer Contributors", email = "pyterraformer@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jinja2",
    "lark",
    "click",
]

[project.urls]
Homepage = "https://github.com/wayfair-incubator/pyterraformer"
changelog = "https://github.com/wayfair-incubator/pyterraformer/blob/main/CHANGELOG.md"
issues = "https://github.com/wayfair-incubator/pyterraformer/issues"
documentation = "https://wayfair-incubator.github.io/pyterraformer"

[tool.hatch.build.targets.sdist]
include = [
    "/pyterraformer",
]

[tool.hatch.build.targets.wheel]
packages = ["pyterraformer"]

[tool.hatch.build.targets.wheel.force-include]
"pyterraformer/serializer/templates" = "pyterraformer/serializer/templates"

# type checking
[tool.mypy]
ignore_missing_imports = true

# testing
[tool.pytest.ini_options]
addopts = "--verbose --cov=pyterraformer --cov-report xml:/tmp/coverage.xml --cov-report term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
data_file = "/tmp/pyterraformer_coverage"

[tool.coverage.report]
fail_under = 40
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover"
]

# linting and formatting with ruff
[tool.ruff]
line-length = 127
target-version = "py310"
exclude = [
    ".git",
    ".github",
    "examples",
    "__pycache__",
    "venv",
    "env",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (acceptable in tests)
    "S603",   # subprocess call - false positive for trusted input
    "F401",   # unused imports (in __init__.py files)
    "F811",   # redefinition of unused name
    "C901",   # too complex
    "UP035",  # deprecated typing imports (Dict, List, etc.) - keep for compatibility
    "B904",   # raise from in except clause - not critical
    "E402",   # module level import not at top of file - needed for template strings
    "SIM101", # multiple isinstance calls - keep for readability
    "SIM108", # ternary operator - keep if-else for readability
    "SIM114", # combine if branches - keep for readability
    "SIM118", # key in dict.keys() - keep for clarity
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["pyterraformer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# version bumping
[tool.hyper-bump-it.git.actions]
commit = "create-and-push"
branch = "create-and-push"

[[tool.hyper-bump-it.files]]
file_glob = "pyproject.toml"
keystone = true
search_format_pattern = "version = \"{version}\""

[[tool.hyper-bump-it.files]]
file_glob = "pyterraformer/__init__.py"

[[tool.hyper-bump-it.files]]
file_glob = "docs/index.md"
search_format_pattern = "Pyterraformer - {version}"

[[tool.hyper-bump-it.files]]
file_glob = "CHANGELOG.md"
search_format_pattern = "## [Unreleased]"
replace_format_pattern = """## [Unreleased]

## [{version}] - {today}"""
